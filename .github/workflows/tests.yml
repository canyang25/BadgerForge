name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # setup-uv already created and activated a venv via python-version.
      - name: Install the package
        run: uv pip install -e ".[dev]"

      - name: Run tests
        run: .venv/bin/pytest -q

      - name: Check no secrets were committed
        run: |
          # .env.op and .env.op.local hold op:// references. A real key would
          # be a long opaque string, never an op:// URI.
          if grep -rIn --exclude-dir=.git --exclude-dir=.venv -E "sk-[A-Za-z0-9]{20,}" .; then
            echo "::error::Something that looks like an API key is committed"
            exit 1
          fi
