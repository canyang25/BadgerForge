[project]
name = "badgerforge"
version = "0.1.0"
description = "MLM26 Efficient Coder agent for Terminal-Bench 2.1 (via Harbor)"
requires-python = ">=3.12"
dependencies = [
    "harbor>=0.23",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "agent.prompts", "agent.tools", "eval"]

[tool.pytest.ini_options]
# Only collect our own tests. test_prompt.py at the repo root is a hand-run
# gateway demo, not a test: importing it opens a client and needs a key.
testpaths = ["tests"]
